<style>
:root{--bg:#F2F4F3;--card:#FFFFFF;--ink:#1D2321;--mut:#5F6A66;--line:#D3D9D6;--btn-ink:#F2F4F3}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1A201D;--ink:#E8ECEA;--mut:#9AA5A0;--line:#2D3632;--btn-ink:#121614}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Pretendard","Apple SD Gothic Neo","Noto Sans KR","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.app{max-width:480px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em}
.sub{margin:2px 0 0;color:var(--mut);font-size:13px}
.cup{display:block;width:100%;margin-top:14px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.cup::placeholder{color:var(--mut)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.cup:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:7px 11px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--btn-ink);font-weight:600}
#wheel{margin:12px 0 4px}
#wheel svg{display:block;width:100%;height:auto}
#wheel [data-c]{cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:transparent;font-size:13px}
.pill i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill.on{border-color:var(--ink);font-weight:600}
h2{margin:20px 0 6px;font-size:14px;font-weight:600}
.hint{margin:0;color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border:1px solid;border-radius:8px;font-size:14px;background:transparent}
.chip.on{font-weight:600}
.chip small{margin-left:6px;font-size:11px;color:var(--mut);font-weight:400}
.tray{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:64px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:14px}
.act.main{background:var(--ink);color:var(--btn-ink);border-color:var(--ink);font-weight:600}
.act:disabled{opacity:.4;cursor:default}
#toast{position:sticky;bottom:12px;margin-top:12px;min-height:20px;text-align:center;font-size:13px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){#wheel path{transition:fill-opacity .15s}}
</style>
</head>
<body>
<div class="app">
<header>
<div>
<h1 id="ttl"></h1>

<button type="button" data-l="en">EN</button>
<button type="button" data-l="ko">한글</button>

</div>

</div>

['Herbal','허브','草本','#6BA34A','Bergamot|베르가못|佛手柑;Lemongrass|레몬그라스|香茅;glass|유리|玻璃;pepper|후추|胡椒;rooibos|루이보스|路易波士茶;cinnamon|계피|肉桂;rosemary|로즈마리|迷迭香;verbena|버베나|马鞭草;lemon thyme|레몬 타임|柠檬百里香'],
['Alcohol','발효','酒香','#8A2F4D','whisky|위스키|威士忌;sherry whiskey|셰리 위스키|雪莉威士忌;white wine|화이트 와인|白葡萄酒;red wine|레드 와인|红葡萄酒;white rum|화이트 럼|白朗姆酒'],
['Tea','차','茶感','#A87B4F','Black tea|홍차(블랙티)|红茶 (Black tea);Red tea|레드티|红茶 (Red tea);Green tea|녹차|绿茶;White tea|백차|白茶;Hibiscus|히비스커스|洛神花;Darjeeling|다즐링|大吉岭红茶;Jasmine tea|자스민 차|茉莉花茶'],

['Texture','질감','口感','#8F8E88','silky|실키|丝滑;milky|밀키|奶感;jam|잼|果酱感;syrup|시럽|糖浆感;juicy|주시|多汁;candy|캔디|糖果感']
];
var CATS=RAW.map(function(r){return{n:r[0],k:r[1],z:r[2],c:r[3],t:r[4].split(';').map(function(x){var p=x.split('|');return{e:p[0],k:p[1],z:p[2]};})};});
var I={
ko:{ttl:'향미 휠',sub:'시음하면서 눌러서 찾아보세요',th:'내가 고른 향미',empty:'고른 향미가 여기에 쌓입니다.',notes:'향미',hint:'분류를 눌러 향미를 확인하고, 느낀 향미를 눌러 고르세요.',copy:'텍스트 복사',img:'이미지 저장',clr:'초기화',copied:'복사했습니다',cfail:'복사하지 못했습니다',ifail:'이미지를 만들지 못했습니다',isaved:'이미지를 저장했습니다',confirm:'컵 이름과 고른 향미를 모두 지울까요?',cupph:'컵 이름 (예: 에티오피아 게뎁 워시드)',cupl:'컵 이름',wl:'향미 휠',colon:': ',sep:', ',max:28,html:'ko'},
en:{ttl:'Flavor wheel',sub:'Tap the notes you taste',th:'My notes',empty:'Selected notes will appear here.',notes:'Notes',hint:'Tap a category, then tap the notes you taste.',copy:'Copy text',img:'Save image',clr:'Clear',copied:'Copied',cfail:'Copy failed',ifail:'Could not create image',isaved:'Image saved',confirm:'Clear the cup name and all selected notes?',cupph:'Cup name (e.g. Ethiopia Gedeb Washed)',cupl:'Cup name',wl:'Flavor wheel',colon:': ',sep:', ',max:50,html:'en'},
zh:{ttl:'风味轮',sub:'边喝边点，找到你尝到的风味',th:'我选的风味',empty:'选中的风味会显示在这里。',notes:'风味',hint:'点击分类查看风味，再点你尝到的风味进行选择。',copy:'复制文字',img:'保存图片',clr:'重置',copied:'已复制',cfail:'复制失败',ifail:'无法生成图片',isaved:'图片已保存',confirm:'清除杯子名称和所有已选风味吗？',cupph:'杯子名称（例如：埃塞俄比亚 格德奥 水洗）',cupl:'杯子名称',wl:'风味轮',colon:'：',sep:'、',max:28,html:'zh-CN'}
};
var KEY='sowon-flavor-wheel-multi-v1';
var act=null,sel=[],lang='ko',cup='',timer=null;
var CX=200,CY=170;
var FONT='Apple SD Gothic Neo,Noto Sans KR,PingFang SC,Microsoft YaHei,Noto Sans SC,Helvetica,Arial,sans-serif';

function load(){
try{
var raw=localStorage.getItem(KEY);
if(!raw)return;
var o=JSON.parse(raw);
if(o.lang==='ko'||o.lang==='en'||o.lang==='zh')lang=o.lang;
if(typeof o.cup==='string')cup=o.cup.slice(0,40);
if(Array.isArray(o.sel)){
sel=o.sel.filter(function(k){
var p=String(k).split(':');
return p.length===2&&CATS[+p[0]]&&CATS[+p[0]].t[+p[1]];
});
}
}catch(e){}
}
function save(){
try{localStorage.setItem(KEY,JSON.stringify({sel:sel,lang:lang,cup:cup}));}catch(e){}
}
function T(k){return I[lang][k];}
function cname(d){return lang==='ko'?d.k:(lang==='zh'?d.z:d.n);}
function tname(t){return lang==='ko'?t.k:(lang==='zh'?t.z:t.e);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function pt(r,a){var t=a*Math.PI/180;return [(CX+r*Math.sin(t)).toFixed(1),(CY-r*Math.cos(t)).toFixed(1)];}
function sec(r0,r1,a0,a1){
var p1=pt(r1,a0),p2=pt(r1,a1),p3=pt(r0,a1),p4=pt(r0,a0);
return 'M'+p1+' A'+r1+' '+r1+' 0 0 1 '+p2+' L'+p3+' A'+r0+' '+r0+' 0 0 0 '+p4+' Z';
}
function wheel(ex){
var A=ex?null:act;
var ink=ex?'#1D2321':'var(--ink)',mut=ex?'#5F6A66':'var(--mut)',bg=ex?'#FFFFFF':'var(--bg)';
var s='',a=0;
CATS.forEach(function(d,ci){
var n=d.t.length,a0=a,a1=a+n*4;
var op=ex?0.55:(A===null?0.6:(A===ci?0.95:0.22));
s+='<path data-c="'+ci+'" d="'+sec(44,76,a0+0.5,a1-0.5)+'" style="fill:'+d.c+';fill-opacity:'+op+';stroke:'+bg+';stroke-width:1.2"/>';
d.t.forEach(function(t,ti){
var on=sel.indexOf(ci+':'+ti)>=0;
var so=on?1:(ex?0.16:(A===ci?0.62:0.2));
s+='<path data-c="'+ci+'" d="'+sec(80,on?126:120,a0+ti*4,a0+ti*4+4)+'" style="fill:'+d.c+';fill-opacity:'+so+';stroke:'+bg+';stroke-width:0.8"/>';
});
var m=a0+n*2,lp=pt(136,m);
var anc=(m>10&&m<170)?'start':((m>190&&m<350)?'end':'middle');
s+='<text data-c="'+ci+'" x="'+lp[0]+'" y="'+lp[1]+'" text-anchor="'+anc+'" dominant-baseline="central" style="font-size:12px;font-weight:'+(A===ci?600:400)+';fill:'+(A===ci?ink:mut)+'">'+esc(cname(d))+'</text>';
a=a1;
});
if(A!==null){
s+='<text x="'+CX+'" y="'+CY+'" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:600;fill:'+ink+'">'+esc(cname(CATS[A]))+'</text>';
}
return s;
}
function chipHtml(ci,ti,inTray){
var d=CATS[ci],t=d.t[ti],on=sel.indexOf(ci+':'+ti)>=0;
var sub=(!inTray&&lang==='en')?'<small>'+esc(t.k)+' · '+esc(t.z)+'</small>':'';
return '<button type="button" class="chip'+(on?' on':'')+'" data-t="'+ci+':'+ti+'" aria-pressed="'+(on?'true':'false')+'" style="border-color:'+d.c+';background:'+d.c+(on?'66':'1f')+'">'+esc(tname(t))+sub+'</button>';
}
function render(){
document.getElementById('wheel').innerHTML='<svg viewBox="0 0 400 340" role="img" aria-label="'+T('wl')+'">'+wheel(false)+'</svg>';
var p='';
CATS.forEach(function(d,i){
p+='<button type="button" class="pill'+(act===i?' on':'')+'" data-c="'+i+'" aria-pressed="'+(act===i?'true':'false')+'"><i style="background:'+d.c+'"></i>'+esc(cname(d))+'</button>';
});

var h='';
if(act===null){
h='<h2>'+T('notes')+'</h2><p class="hint">'+T('hint')+'</p>';
}else{
var d=CATS[act];
h='<h2>'+esc(cname(d))+'</h2><div class="chips">';
d.t.forEach(function(t,ti){h+=chipHtml(act,ti,false);});

}
document.getElementById('panel').innerHTML=h;
document.getElementById('ttl').textContent=T('ttl');
document.getElementById('sub').textContent=T('sub');
document.getElementById('th').textContent=T('th');

if(!sel.length){tr='<p class="hint">'+T('empty')+'</p>';}
else{tr='<div class="chips">';sel.forEach(function(k){var q=k.split(':');tr+=chipHtml(+q[0],+q[1],true);});tr+='</div>';}

document.getElementById('bcopy').textContent=T('copy');
document.getElementById('bimg').textContent=T('img');
document.getElementById('bclr').textContent=T('clr');

document.getElementById('bclr').disabled=!(sel.length||cup);

function summary(){
var out=[];
CATS.forEach(function(d,ci){
var n=[];
sel.forEach(function(k){var p=k.split(':');if(+p[0]===ci)n.push(tname(d.t[p[1]]));});
if(n.length)out.push(cname(d)+T('colon')+n.join(T('sep')));
});

}
function toast(m){
var el=document.getElementById('toast');
el.textContent=m;

function fallbackCopy(tx){
var a=document.createElement('textarea');
a.value=tx;a.style.position='fixed';a.style.opacity='0';
document.body.appendChild(a);a.select();
var ok=false;
try{ok=document.execCommand('copy');}catch(e){}
document.body.removeChild(a);
toast(ok?T('copied'):T('cfail'));
}
function copyText(){
if(!sel.length)return;
var tx=(cup?cup+'\n':'')+summary().join('\n');
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(tx).then(function(){toast(T('copied'));},function(){fallbackCopy(tx);});
}else{fallbackCopy(tx);}
}
function wrapLine(s,max){
var sep=T('sep'),parts=s.split(sep),lines=[],cur='';
parts.forEach(function(p){
var nx=cur?cur+sep+p:p;
if(nx.length>max&&cur){lines.push(cur+sep.trim());cur=p;}else{cur=nx;}
});
if(cur)lines.push(cur);
return lines;
}
function exportImage(){
if(!sel.length)return;
var W=720,top=96,wh=612,max=T('max');

var H=top+wh+24+rows.length*36+40;
var d=new Date();
var ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="'+FONT+'">';
svg+='<rect width="'+W+'" height="'+H+'" fill="#FFFFFF"/>';
var ts=Math.max(16,Math.min(30,Math.floor(640/Math.max(cup.length,1))));
svg+='<text x="40" y="50" font-size="'+ts+'" font-weight="600" fill="#1D2321">'+esc(cup||T('wl'))+'</text>';
svg+='<text x="40" y="80" font-size="18" fill="#5F6A66">'+ds+'</text>';
svg+='<g transform="translate(0,'+top+') scale(1.8)">'+wheel(true)+'</g>';
rows.forEach(function(r,i){
svg+='<text x="'+(r.ind?64:40)+'" y="'+(top+wh+30+i*36)+'" font-size="22" fill="#1D2321">'+esc(r.t)+'</text>';
});
svg+='</svg>';
var img=new Image();
img.onload=function(){
var cv=document.createElement('canvas');
cv.width=W*2;cv.height=H*2;
var cx=cv.getContext('2d');
cx.scale(2,2);
cx.drawImage(img,0,0,W,H);
cv.toBlob(function(b){
if(!b){toast(T('ifail'));return;}
var f=null;
try{f=new File([b],'flavor-wheel.png',{type:'image/png'});}catch(e){}
if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
navigator.share({files:[f]}).catch(function(){});
}else{
var u=URL.createObjectURL(b);
var a=document.createElement('a');
a.href=u;a.download='flavor-wheel.png';
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(u);},4000);
toast(T('isaved'));
}
},'image/png');
};
img.onerror=function(){toast(T('ifail'));};
img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
document.addEventListener('click',function(e){
var el=e.target.closest('[data-t],[data-c],[data-l],[data-a]');
if(!el)return;
var v;
if((v=el.getAttribute('data-t'))!==null){
var i=sel.indexOf(v);
if(i>=0)sel.splice(i,1);else sel.push(v);
render();
}else if((v=el.getAttribute('data-c'))!==null){
var c=+v;
act=(act===c)?null:c;
render();
}else if((v=el.getAttribute('data-l'))!==null){
lang=v;
render();
}else if((v=el.getAttribute('data-a'))!==null){
if(v==='copy')copyText();
else if(v==='img')exportImage();
else if(v==='clr'){
if((sel.length||cup)&&window.confirm(T('confirm'))){sel=[];cup='';render();}
}
}
});
document.getElementById('cup').addEventListener('input',function(e){cup=e.target.value.slice(0,40);render();});
load();
render();
</script>
</body>
</html>

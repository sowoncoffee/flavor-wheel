<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>소원커피라벨</title>
<style>
:root{--o:#c1803d;--d:#7f4a27;--t:#2b2f3a;--m:#8a8f9a;--l:#e4e6ea;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:28px;padding:calc(22px + env(safe-area-inset-top)) 24px 18px;max-width:600px;margin:auto}
.logo{background:#2b2522;color:#fff;border-radius:12px;padding:10px 14px;text-align:center;line-height:1}
.logo b{display:block;font-size:22px;font-weight:600;padding-bottom:6px;border-bottom:1px solid #5a504a}
.logo i{display:block;font-size:8px;letter-spacing:3px;font-style:normal;margin-top:6px}
h1{font-size:23px;margin:0;font-weight:800}
nav{display:flex;border-top:1px solid var(--l);border-bottom:1px solid var(--l);max-width:600px;margin:auto}
.tab{flex:1;border:0;background:none;padding:16px 0;font:700 16px inherit;font-family:inherit;color:var(--m);border-bottom:3px solid transparent}
.tab.on{color:var(--d);background:#fdf6ee;border-color:var(--o)}
main,#list{max-width:600px;margin:auto;padding:8px 24px}
h2{font-size:19px;margin:30px 0 14px;font-weight:800}
.sub{font-size:13px;color:var(--m);margin:26px 0 10px;font-weight:700}
.cat{font-size:14px;color:var(--m);font-weight:700;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px 8px}
.chip{border:1px solid var(--l);background:#fff;border-radius:10px;padding:9px 14px;font:15px inherit;font-family:inherit;color:#4a4f5c}
.chip.on{background:var(--o);border-color:var(--o);color:#fff}
input,textarea{width:100%;border:1.5px solid var(--l);border-radius:16px;padding:15px 18px;font:17px inherit;font-family:inherit;color:var(--t);background:#fff;margin-top:14px}
input:first-child,h2+input{margin-top:0}
textarea{font-weight:700;resize:vertical;margin-top:0}
input:focus,textarea:focus{outline:2px solid var(--o);outline-offset:1px}
.hint{font-size:13px;color:var(--m);margin:10px 0 0}
.two{display:flex;gap:10px}
.seg{flex:1;border:1.5px solid var(--l);background:#fff;border-radius:14px;padding:15px;font:700 17px inherit;font-family:inherit;color:#4a4f5c}
.seg.on{background:var(--o);border-color:var(--o);color:#fff}
canvas{display:block;width:100%;max-width:400px;margin:0 auto;border-radius:12px;border:1px solid var(--l)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#f7f8fa;border-top:1px solid var(--l);padding:16px 24px calc(16px + env(safe-area-inset-bottom))}
.bar>div{max-width:600px;margin:auto;display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:16px;padding:18px;font:800 19px inherit;font-family:inherit}
.main{background:var(--d);color:#fff}
.sec{background:#fff;color:var(--d);border:1.5px solid var(--l)}
.card{display:flex;align-items:center;gap:8px;border:1px solid var(--l);border-radius:14px;padding:14px 16px;margin:12px 0}
.card div{flex:1;min-width:0}.card b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--m)}
.card button{border:1px solid var(--l);background:#fff;border-radius:10px;padding:8px 12px;font:14px inherit;font-family:inherit}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2522;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="logo"><b>SOWON</b><i>COFFEE</i></div><h1>원두 라벨 편집기</h1></header>
<nav><button class="tab on" data-t="edit">＋ 라벨 편집</button><button class="tab" data-t="list">저장 목록</button></nav>

<main id="edit">
<h2>국가 선택 (Country)</h2>
<div class="chips" data-g="country"></div><input id="country" placeholder="국가 직접 입력 또는 선택된 항목" style="margin-top:18px">
<h2>제품명 (Name)</h2>
<input id="name" placeholder="Uraga tome">
<h2>품종 (Varietal)</h2>
<div class="chips" data-g="varietal"></div><input id="varietal" placeholder="품종 직접 입력 또는 선택된 항목" style="margin-top:18px">
<h2>가공 (Processing)</h2>
<div class="chips" data-g="process"></div><input id="process" placeholder="가공 방식 직접 입력 또는 선택된 항목" style="margin-top:18px">
<h2>고도 (Altitude)</h2>
<input id="alt" placeholder="1950~2150" inputmode="text">
<h2>용도 (Usage)</h2>
<div class="two"><button class="seg on" data-u="Brewing">Brewing</button><button class="seg" data-u="Espresso">Espresso</button><button class="seg" data-u="Omni">Omni</button></div>
<h2>플레이버 (Flavor)</h2>
<div id="flavors"></div>
<div class="sub">선택된 플레이버 수정 (SELECTED OUTPUT - EDITABLE)</div>
<textarea id="flavor" rows="3"></textarea>
<p class="hint">* 입력창의 컵노트를 직접 지우거나, 쉼표(,)로 구분해 새로운 단어를 추가하여 자유롭게 수정해 보세요. (이미지에도 바로 적용됩니다!)</p>
<h2>로스팅 날짜 (Roasting Date)</h2>
<input id="date" type="date">
<h2>색상 (Color)</h2>
<input id="color" inputmode="numeric" placeholder="105">
<h2>미리보기</h2>
<canvas id="cv"></canvas>
</main>

<section id="list" hidden></section>

<div class="bar" id="bar"><div>
<button class="btn main" id="png">이미지 저장 (사진 앱)</button>
<button class="btn sec" id="keep">저장 목록에 담기</button>
</div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const F='-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const D={
country:`Colombia,Ethiopia,Brazil,Guatemala,Kenya,Indonesia,Costa Rica,Vietnam,Panama,Honduras,El Salvador,Nicaragua,Peru,Tanzania,Brundi,Rwanda,Kongo (DRC),China,India,Thailand,Laos,Myanmar,Mexico,Uganda`,
varietal:`Typica,Bourbon,Caturra,Catuai,Catimor,Castillo,Geisha,Pacamara,SL24.28,Heirloom,74158,74110,74112,dere132,Mundo Novo,Maragogype,Pacas,Catu's,Parainema,Sarchimor,Sudan Rume,Blend`,
process:`Natural,Washed,Honey,Wet-Hulled,Anaerobic Natural,Anaerobic Washed,Carbonic Maceration,Fruit Fermentation,Yeast Fermentation,Infused,EA Decaffein,SW Decaffein`};
const FL={
Floral:`jasmin,lily,lavender,coffee blossom,osmanthus,passion flower,freesia,cherry blossom,orange blossom,cotton blossom,chamomile,white flower`,
Acidity:`bright citrus,lemon,lime,pineapple,apricot,peach,pear,fig,red apple,green apple,grape,green grape,shine muscat,grapefruit,pomelo,passionfruit,raspberry,strawberry,wild strawberry,blueberry,black currant,quince,mango,orange,red orange,tangerine,green tangerine,plum,dark plum,cherry,cranberry,tropical,yogurt`,
Sweetness:`brown sugar,honey,molasses,caramel,maple syrup,milk chocolate,chocolate,dark chocolate,cocoa,acacia,vanilla`,
Herbal:`Bergamot,Lemongrass,glass,pepper,rooibos,cinnamon,rosemary,verbena,lemon thyme,tea rose`,
Alcohol:`whisky,sherry whiskey,white wine,red wine,white rum`,
Tea:`Black tea,Red tea,Green tea,White tea,Hibiscus,Darjeeling,Jasmine tea`,
Nutty:`Almond,Hazelnut,Walnut,Peanut,Cashew,Pecan,Chestnut`,
Texture:`silky,milky,jam,syrup,juicy,candy`};
const el={country:$('#country'),varietal:$('#varietal'),process:$('#process'),flavor:$('#flavor')};
const multi={varietal:1,flavor:1};
let usage='Brewing';

const mk=(g,v)=>{const b=document.createElement('button');b.className='chip';b.textContent=v;b.dataset.g=g;b.dataset.v=v;return b};
for(const g in D){const c=$(`.chips[data-g=${g}]`);D[g].split(',').forEach(v=>c.append(mk(g,v)))}
for(const k in FL){const h=document.createElement('div');h.className='cat';h.textContent=k;const c=document.createElement('div');c.className='chips';FL[k].split(',').forEach(v=>c.append(mk('flavor',v)));$('#flavors').append(h,c)}

const list=g=>el[g].value.split(',').map(s=>s.trim()).filter(Boolean);
const has=(a,v)=>a.some(s=>s.toLowerCase()===v.toLowerCase());

document.addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const g=b.dataset.g,v=g==='flavor'?b.dataset.v.toUpperCase():b.dataset.v;
  let a=list(g);const i=a.findIndex(s=>s.toLowerCase()===v.toLowerCase());
  if(multi[g]){i<0?a.push(v):a.splice(i,1)}else a=i<0?[v]:[];
  el[g].value=a.join(', ');sync();
});
document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>setUsage(b.dataset.u));
function setUsage(u){usage=u;document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('on',b.dataset.u===u));draw()}
document.querySelectorAll('input,textarea').forEach(i=>i.addEventListener('input',sync));

function sync(){
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',has(list(b.dataset.g),b.dataset.v)));
  draw();
}

// ---- 라벨 그리기 (800 x 1200, 2:3 = 400 x 600 비율) ----
function wrap(x,t,cx,y,w,lh,dry){
  let l='';
  for(const s of t.split(/\s+/).filter(Boolean)){
    const k=l?l+' '+s:s;
    if(x.measureText(k).width>w&&l){if(!dry)x.fillText(l,cx,y);y+=lh;l=s}else l=k;
  }
  if(l){if(!dry)x.fillText(l,cx,y);y+=lh}
  return y;
}
// 영역에 들어가는 가장 큰 글자 크기를 찾아 줄 간격을 돌려줌
const SERIF='"Didot","Bodoni 72","Playfair Display","Times New Roman",serif';
function fit(x,t,w,wt,max,min,maxH,k,fam){
  fam=fam||F;let s=max;
  for(;s>min;s-=2){x.font=wt+' '+s+'px '+fam;if(wrap(x,t,0,0,w,s*k,1)<=maxH)break}
  x.font=wt+' '+s+'px '+fam;return s*k;
}
// 자간을 넓혀 가운데 정렬로 그리기 (프라다식 와이드 트래킹)
function track(x,t,cx,y,sp){
  const cs=[...t],ws=cs.map(c=>x.measureText(c).width);
  let px=cx-(ws.reduce((a,b)=>a+b,0)+sp*(cs.length-1))/2;
  x.textAlign='left';cs.forEach((c,i)=>{x.fillText(c,px,y);px+=ws[i]+sp});x.textAlign='center';
}
function draw(){
  const cv=$('#cv'),W=800,H=1200,x=cv.getContext('2d'),v=id=>$('#'+id).value.trim(),w=W-120,K='#000';
  cv.width=W;cv.height=H;
  // 흑백 인쇄용: 흰 바탕 + 순수 검정만 (띠·칸막이 없음)
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle=K;x.textAlign='center';
  // 로고 (크기 그대로, 흰 바탕 위 검정 글씨)
  x.font='400 70px '+SERIF;track(x,'SOWON',W/2,104,16);
  x.font='500 22px '+F;track(x,'COFFEE',W/2,148,12);
  // 본문
  x.font='600 40px '+F;track(x,v('country').toUpperCase(),W/2,292,10);
  let lh=fit(x,v('name').toUpperCase(),w,400,100,56,230,1.15,SERIF);
  let y=wrap(x,v('name').toUpperCase(),W/2,400,w,lh);
  const sub=[v('varietal'),v('process')].filter(Boolean).join('  ·  ').toUpperCase();
  lh=fit(x,sub,w,600,40,28,110,1.3);
  y=wrap(x,sub,W/2,y+14,w,lh);
  x.fillRect(W/2-45,y+6,90,3);
  const fy=y+100;
  lh=fit(x,v('flavor'),w,700,64,34,925-fy,1.35);
  wrap(x,v('flavor'),W/2,fy,w,lh);
  // 하단 정보 2x2
  const I=[['ALTITUDE',v('alt')?v('alt')+' m':'-'],['USAGE',usage],['ROASTED',v('date').replace(/-/g,'.')||'-'],['COLOR',v('color')||'-']];
  I.forEach((p,i)=>{
    const cx=200+(i%2)*400,ry=i<2?0:120;
    x.font='700 24px '+F;track(x,p[0],cx,998+ry,6);
    x.font='700 44px '+F;x.fillText(p[1],cx,1055+ry);
  });
}

// ---- 이미지 저장: 공유 시트 → 이미지 저장 = 사진 앱에 바로 저장 ----
async function saveToPhotos(){
  const cv=$('#cv');draw();
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const name=(($('#name').value.trim()||'sowon-label').replace(/[\\/:*?"<>|]/g,'')||'sowon-label');
  const file=new File([blob],name+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});finish();return}
    catch(e){if(e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob);
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)){
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:20px;text-align:center';
    o.innerHTML='<img src="'+url+'" style="max-width:88%;max-height:68%;border-radius:8px"><div>이미지를 길게 눌러 사진에 추가를 선택하세요</div><button class="btn sec" style="padding:12px 28px;font-size:16px">닫기</button>';
    o.querySelector('button').onclick=()=>o.remove();
    document.body.append(o);
  }else{
    const a=document.createElement('a');a.href=url;a.download=name+'.png';a.click();
  }
  finish();
}
$('#png').onclick=saveToPhotos;

// ---- 저장 목록 ----
const K='sowon_labels',IDS=['country','name','varietal','process','alt','flavor','date','color'];
const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}};
const store=a=>{try{localStorage.setItem(K,JSON.stringify(a))}catch(e){toast('저장 공간을 사용할 수 없어요')}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function addList(){
  const o={id:Date.now(),usage};IDS.forEach(i=>o[i]=$('#'+i).value);
  const a=load(),f=a[0];
  if(f&&f.usage===o.usage&&IDS.every(i=>f[i]===o[i]))return false;
  store([o,...a]);return true;
}
$('#keep').onclick=()=>toast(addList()?'저장 목록에 담았어요':'이미 저장 목록에 있어요');
function today(){const n=new Date(),p=z=>String(z).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())}
// 이미지 저장 후: 저장 목록에 자동 저장 + 처음 상태로 초기화
function resetForm(){IDS.forEach(i=>$('#'+i).value='');$('#date').value=today();setUsage('Brewing');sync();scrollTo(0,0)}
function finish(){addList();resetForm();toast('저장 목록에 담고 새로 시작해요')}
function renderList(){
  const a=load(),box=$('#list');box.innerHTML='';
  if(!a.length){box.innerHTML='<p class="hint" style="margin-top:30px">저장된 라벨이 없습니다. 라벨 편집에서 저장 목록에 담아보세요.</p>';return}
  a.forEach(o=>{
    const d=document.createElement('div');d.className='card';
    d.innerHTML='<div><b></b><small></small></div><button>불러오기</button><button>삭제</button>';
    d.querySelector('b').textContent=o.name||'(이름 없음)';
    d.querySelector('small').textContent=[o.country,o.date&&o.date.replace(/-/g,'.')].filter(Boolean).join(' · ');
    const [lo,de]=d.querySelectorAll('button');
    lo.onclick=()=>{IDS.forEach(i=>$('#'+i).value=o[i]||'');setUsage(o.usage||'Brewing');tab('edit');sync()};
    de.onclick=()=>{store(load().filter(z=>z.id!==o.id));renderList()};
    box.append(d);
  });
}
function tab(t){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  $('#edit').hidden=t!=='edit';$('#list').hidden=t!=='list';$('#bar').hidden=t!=='edit';
  if(t==='list')renderList();
  scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));

// 시작: 오늘 날짜
$('#date').value=today();
sync();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="향미 휠">
<meta name="description" content="시음하면서 눌러 찾는 커피 향미 휠">
<title>향미 휠</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8622C'/%3E%3Cpath d='M16 2a14 14 0 0 1 14 14H16z' fill='%23E58AB0'/%3E%3Cpath d='M16 30A14 14 0 0 1 2 16h14z' fill='%236BA34A'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{--bg:#F2F4F3;--card:#FFFFFF;--ink:#1D2321;--mut:#5F6A66;--line:#D3D9D6;--btn-ink:#F2F4F3}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1A201D;--ink:#E8ECEA;--mut:#9AA5A0;--line:#2D3632;--btn-ink:#121614}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.app{max-width:480px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em}
.sub{margin:2px 0 0;color:var(--mut);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--btn-ink);font-weight:600}
#wheel{margin:12px 0 4px}
#wheel svg{display:block;width:100%;height:auto}
#wheel [data-c]{cursor:pointer}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:transparent;font-size:13px}
.pill i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pill b{font-weight:400;color:var(--mut)}
.pill.on{border-color:var(--ink);font-weight:600}
h2{margin:20px 0 6px;font-size:14px;font-weight:600}
h2 span{font-weight:400;color:var(--mut)}
.hint{margin:0;color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border:1px solid;border-radius:8px;font-size:14px;background:transparent}
.chip.on{font-weight:600}
.chip small{margin-left:6px;font-size:11px;color:var(--mut);font-weight:400}
.tray{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:64px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:14px}
.act.main{background:var(--ink);color:var(--btn-ink);border-color:var(--ink);font-weight:600}
.act:disabled{opacity:.4;cursor:default}
#toast{position:sticky;bottom:12px;margin-top:12px;min-height:20px;text-align:center;font-size:13px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){#wheel path{transition:fill-opacity .15s}}
</style>
</head>
<body>
<div class="app">
<header>
<div>
<h1>향미 휠</h1>
<p class="sub">시음하면서 눌러서 찾아보세요</p>
</div>
<div class="seg" role="group" aria-label="언어">
<button type="button" data-l="en">EN</button>
<button type="button" data-l="ko">한글</button>
</div>
</header>
<div id="wheel"></div>
<div class="pills" id="pills"></div>
<div id="panel"></div>
<h2 id="th">내가 고른 향미</h2>
<div class="tray" id="tray"></div>
<div class="acts">
<button type="button" class="act main" data-a="copy" id="bcopy">텍스트 복사</button>
<button type="button" class="act" data-a="img" id="bimg">이미지 저장</button>
<button type="button" class="act" data-a="clr" id="bclr">초기화</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</div>
<script>
var RAW=[
['Floral','꽃향','#E58AB0','jasmin|자스민;lily|백합;lavender|라벤더;coffee blossom|커피 꽃;osmanthus|금목서;passion flower|패션 플라워;freesia|프리지아;cherry blossom|벚꽃;orange blossom|오렌지 꽃;cotton blossom|목화꽃;chamomile|카모마일;white flower|흰 꽃'],
['Acidity','산미','#E8622C','bright citrus|밝은 시트러스;lemon|레몬;lime|라임;pineapple|파인애플;apricot|살구;peach|복숭아;pear|배;fig|무화과;red apple|붉은 사과;green apple|청사과;grape|포도;green grape|청포도;shine muscat|샤인머스켓;grapefruit|자몽;pomelo|포멜로;passionfruit|패션프루트;raspberry|라즈베리;strawberry|딸기;wild strawberry|야생 딸기;blueberry|블루베리;black currant|블랙커런트;quince|마르멜로;mango|망고;orange|오렌지;red orange|붉은 오렌지;tangerine|귤;green tangerine|청귤;plum|자두;dark plum|검붉은 자두;cherry|체리;cranberry|크랜베리;tropical|트로피컬;yogurt|요거트'],
['Sweetness','단맛','#B9772B','brown sugar|흑설탕;honey|꿀;molasses|당밀;caramel|카라멜;maple syrup|메이플 시럽;milk chocolate|밀크 초콜릿;chocolate|초콜릿;dark chocolate|다크 초콜릿;cocoa|코코아;acacia|아카시아;vanilla|바닐라'],
['Herbal','허브','#6BA34A','Bergamot|베르가못;Lemongrass|레몬그라스;glass|유리;pepper|후추;rooibos|루이보스;cinnamon|계피;rosemary|로즈마리;verbena|버베나;lemon thyme|레몬 타임'],
['Alcohol','발효','#8A2F4D','whisky|위스키;sherry whiskey|셰리 위스키;white wine|화이트 와인;red wine|레드 와인;white rum|화이트 럼'],
['Tea','차','#A87B4F','Black tea|홍차(블랙티);Red tea|레드티;Green tea|녹차;White tea|백차;Hibiscus|히비스커스;Darjeeling|다즐링;Jasmine tea|자스민 차'],
['Nutty','견과','#8B5E3C','Almond|아몬드;Hazelnut|헤이즐넛;Walnut|호두;Peanut|땅콩;Cashew|캐슈넛;Pecan|피칸;Chestnut|밤'],
['Texture','질감','#8F8E88','silky|실키;milky|밀키;jam|잼;syrup|시럽;juicy|주시;candy|캔디']
];
var CATS=RAW.map(function(r){return{n:r[0],k:r[1],c:r[2],t:r[3].split(';').map(function(x){var p=x.split('|');return{e:p[0],k:p[1]};})};});
var TOTAL=0;CATS.forEach(function(d){TOTAL+=d.t.length;});
var KEY='sowon-flavor-wheel-v1';
var act=null,sel=[],lang='en',timer=null;
var CX=200,CY=170;

function load(){
try{
var raw=localStorage.getItem(KEY);
if(!raw)return;
var o=JSON.parse(raw);
if(o.lang==='ko'||o.lang==='en')lang=o.lang;
if(Array.isArray(o.sel)){
sel=o.sel.filter(function(k){
var p=String(k).split(':');
return p.length===2&&CATS[+p[0]]&&CATS[+p[0]].t[+p[1]];
});
}
}catch(e){}
}
function save(){
try{localStorage.setItem(KEY,JSON.stringify({sel:sel,lang:lang}));}catch(e){}
}
function cname(d){return lang==='ko'?d.k:d.n;}
function tname(t){return lang==='ko'?t.k:t.e;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function pt(r,a){var t=a*Math.PI/180;return [(CX+r*Math.sin(t)).toFixed(1),(CY-r*Math.cos(t)).toFixed(1)];}
function sec(r0,r1,a0,a1){
var p1=pt(r1,a0),p2=pt(r1,a1),p3=pt(r0,a1),p4=pt(r0,a0);
return 'M'+p1+' A'+r1+' '+r1+' 0 0 1 '+p2+' L'+p3+' A'+r0+' '+r0+' 0 0 0 '+p4+' Z';
}
function wheel(ex){
var A=ex?null:act;
var ink=ex?'#1D2321':'var(--ink)',mut=ex?'#5F6A66':'var(--mut)',bg=ex?'#FFFFFF':'var(--bg)';
var s='',a=0;
CATS.forEach(function(d,ci){
var n=d.t.length,a0=a,a1=a+n*4;
var op=ex?0.55:(A===null?0.6:(A===ci?0.95:0.22));
s+='<path data-c="'+ci+'" d="'+sec(44,76,a0+0.5,a1-0.5)+'" style="fill:'+d.c+';fill-opacity:'+op+';stroke:'+bg+';stroke-width:1.2"/>';
d.t.forEach(function(t,ti){
var on=sel.indexOf(ci+':'+ti)>=0;
var so=on?1:(ex?0.16:(A===ci?0.62:0.2));
s+='<path data-c="'+ci+'" d="'+sec(80,on?126:120,a0+ti*4,a0+ti*4+4)+'" style="fill:'+d.c+';fill-opacity:'+so+';stroke:'+bg+';stroke-width:0.8"/>';
});
var m=a0+n*2,lp=pt(136,m);
var anc=(m>10&&m<170)?'start':((m>190&&m<350)?'end':'middle');
s+='<text data-c="'+ci+'" x="'+lp[0]+'" y="'+lp[1]+'" text-anchor="'+anc+'" dominant-baseline="central" style="font-size:12px;font-weight:'+(A===ci?600:400)+';fill:'+(A===ci?ink:mut)+'">'+esc(cname(d))+' '+n+'</text>';
a=a1;
});
var l1=A===null?(lang==='ko'?TOTAL+'개 향미':TOTAL+' notes'):cname(CATS[A]);
var l2=lang==='ko'?'선택 '+sel.length:sel.length+' selected';
s+='<text x="'+CX+'" y="'+(CY-8)+'" text-anchor="middle" dominant-baseline="central" style="font-size:14px;font-weight:600;fill:'+ink+'">'+esc(l1)+'</text>';
s+='<text x="'+CX+'" y="'+(CY+12)+'" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:'+mut+'">'+esc(l2)+'</text>';
return s;
}
function chipHtml(ci,ti,inTray){
var d=CATS[ci],t=d.t[ti],on=sel.indexOf(ci+':'+ti)>=0;
var sub=(!inTray&&lang==='en')?'<small>'+esc(t.k)+'</small>':'';
return '<button type="button" class="chip'+(on?' on':'')+'" data-t="'+ci+':'+ti+'" aria-pressed="'+(on?'true':'false')+'" style="border-color:'+d.c+';background:'+d.c+(on?'66':'1f')+'">'+esc(tname(t))+sub+'</button>';
}
function render(){
document.getElementById('wheel').innerHTML='<svg viewBox="0 0 400 340" role="img" aria-label="'+(lang==='ko'?'향미 휠':'Flavor wheel')+'">'+wheel(false)+'</svg>';
var p='';
CATS.forEach(function(d,i){
p+='<button type="button" class="pill'+(act===i?' on':'')+'" data-c="'+i+'" aria-pressed="'+(act===i?'true':'false')+'"><i style="background:'+d.c+'"></i>'+esc(cname(d))+' <b>'+d.t.length+'</b></button>';
});
document.getElementById('pills').innerHTML=p;
var h='';
if(act===null){
h='<h2>'+(lang==='ko'?'향미':'Notes')+'</h2><p class="hint">'+(lang==='ko'?'분류를 눌러 향미를 확인하고, 느낀 향미를 눌러 고르세요.':'Tap a category, then tap the notes you taste.')+'</p>';
}else{
var d=CATS[act],cnt=0;
sel.forEach(function(k){if(+k.split(':')[0]===act)cnt++;});
h='<h2>'+esc(cname(d))+' <span>'+(cnt?cnt+' / ':'')+d.t.length+'</span></h2><div class="chips">';
d.t.forEach(function(t,ti){h+=chipHtml(act,ti,false);});
h+='</div>';
}
document.getElementById('panel').innerHTML=h;
document.getElementById('th').textContent=(lang==='ko'?'내가 고른 향미':'My notes')+(sel.length?' ('+sel.length+')':'');
var tr='';
if(!sel.length){tr='<p class="hint">'+(lang==='ko'?'고른 향미가 여기에 쌓입니다.':'Selected notes will appear here.')+'</p>';}
else{tr='<div class="chips">';sel.forEach(function(k){var q=k.split(':');tr+=chipHtml(+q[0],+q[1],true);});tr+='</div>';}
document.getElementById('tray').innerHTML=tr;
['copy','img','clr'].forEach(function(id){document.getElementById('b'+id).disabled=!sel.length;});
document.getElementById('bcopy').textContent=lang==='ko'?'텍스트 복사':'Copy text';
document.getElementById('bimg').textContent=lang==='ko'?'이미지 저장':'Save image';
document.getElementById('bclr').textContent=lang==='ko'?'초기화':'Clear';
document.querySelectorAll('[data-l]').forEach(function(b){var on=b.getAttribute('data-l')===lang;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');});
document.documentElement.lang=lang==='ko'?'ko':'en';
save();
}
function summary(){
var out=[];
CATS.forEach(function(d,ci){
var n=[];
sel.forEach(function(k){var p=k.split(':');if(+p[0]===ci)n.push(tname(d.t[p[1]]));});
if(n.length)out.push(cname(d)+': '+n.join(', '));
});
return out;
}
function toast(m){
var el=document.getElementById('toast');
el.textContent=m;
clearTimeout(timer);
timer=setTimeout(function(){el.textContent='';},2200);
}
function fallbackCopy(tx){
var a=document.createElement('textarea');
a.value=tx;a.style.position='fixed';a.style.opacity='0';
document.body.appendChild(a);a.select();
var ok=false;
try{ok=document.execCommand('copy');}catch(e){}
document.body.removeChild(a);
toast(ok?(lang==='ko'?'복사했습니다':'Copied'):(lang==='ko'?'복사하지 못했습니다':'Copy failed'));
}
function copyText(){
var tx=summary().join('\n');
if(!tx)return;
if(navigator.clipboard&&navigator.clipboard.writeText){
navigator.clipboard.writeText(tx).then(function(){toast(lang==='ko'?'복사했습니다':'Copied');},function(){fallbackCopy(tx);});
}else{fallbackCopy(tx);}
}
function wrapLine(s,max){
var parts=s.split(', '),lines=[],cur='';
parts.forEach(function(p){
var nx=cur?cur+', '+p:p;
if(nx.length>max&&cur){lines.push(cur+',');cur=p;}else{cur=nx;}
});
if(cur)lines.push(cur);
return lines;
}
function exportImage(){
if(!sel.length)return;
var W=720,top=70,wh=612,max=lang==='ko'?28:50;
var rows=[];
summary().forEach(function(l){wrapLine(l,max).forEach(function(x,i){rows.push({t:x,ind:i>0});});});
var H=top+wh+24+rows.length*36+40;
var d=new Date();
var ds=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Apple SD Gothic Neo, Noto Sans KR, Helvetica, Arial, sans-serif">';
svg+='<rect width="'+W+'" height="'+H+'" fill="#FFFFFF"/>';
svg+='<text x="40" y="50" font-size="30" font-weight="600" fill="#1D2321">'+(lang==='ko'?'향미 휠':'Flavor wheel')+'</text>';
svg+='<text x="'+(W-40)+'" y="50" font-size="20" text-anchor="end" fill="#5F6A66">'+ds+'</text>';
svg+='<g transform="translate(0,'+top+') scale(1.8)">'+wheel(true)+'</g>';
rows.forEach(function(r,i){
svg+='<text x="'+(r.ind?64:40)+'" y="'+(top+wh+30+i*36)+'" font-size="22" fill="#1D2321">'+esc(r.t)+'</text>';
});
svg+='</svg>';
var img=new Image();
img.onload=function(){
var cv=document.createElement('canvas');
cv.width=W*2;cv.height=H*2;
var cx=cv.getContext('2d');
cx.scale(2,2);
cx.drawImage(img,0,0,W,H);
cv.toBlob(function(b){
if(!b){toast(lang==='ko'?'이미지를 만들지 못했습니다':'Could not create image');return;}
var f=null;
try{f=new File([b],'flavor-wheel.png',{type:'image/png'});}catch(e){}
if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
navigator.share({files:[f]}).catch(function(){});
}else{
var u=URL.createObjectURL(b);
var a=document.createElement('a');
a.href=u;a.download='flavor-wheel.png';
document.body.appendChild(a);a.click();document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(u);},4000);
toast(lang==='ko'?'이미지를 저장했습니다':'Image saved');
}
},'image/png');
};
img.onerror=function(){toast(lang==='ko'?'이미지를 만들지 못했습니다':'Could not create image');};
img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
document.addEventListener('click',function(e){
var el=e.target.closest('[data-t],[data-c],[data-l],[data-a]');
if(!el)return;
var v;
if((v=el.getAttribute('data-t'))!==null){
var i=sel.indexOf(v);
if(i>=0)sel.splice(i,1);else sel.push(v);
render();
}else if((v=el.getAttribute('data-c'))!==null){
var c=+v;
act=(act===c)?null:c;
render();
}else if((v=el.getAttribute('data-l'))!==null){
lang=v;
render();
}else if((v=el.getAttribute('data-a'))!==null){
if(v==='copy')copyText();
else if(v==='img')exportImage();
else if(v==='clr'){
if(sel.length&&window.confirm(lang==='ko'?'고른 향미를 모두 지울까요?':'Clear all selected notes?')){sel=[];render();}
}
}
});
load();
render();
</script>
</body>
</html>
